name: fad_conception
description: "FAD Conception - le radar tech verifie"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Design system
  phosphor_flutter: ^2.1.0
  flutter_svg: ^2.0.10+1

  # Storage & i18n
  shared_preferences: ^2.3.4
  intl: any

  # Permissions (microphone for voice notes)
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/brand/
    - assets/icons/
    - assets/icons/duo/

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
